<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" role="img" aria-label="오늘의 K-운세 카드 9:16">
  <title>오늘의 K-운세 - 민티</title>

  <!-- ============ DEFS: 폰트, 그라데이션, 패턴 ============ -->
  <defs>
    <!-- 폰트 로드 (SVG 단독 미리보기에서도 가능한 수준으로 임포트) -->
    <style type="text/css"><![CDATA[
      @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.min.css');
      @import url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/Cafe24Ohsquareair.css');
      .pretendard { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
      .handwriting { font-family: 'Cafe24Ohsquareair', 'Pretendard', sans-serif; }
      .num-display { font-family: 'Pretendard', sans-serif; font-weight: 800; font-feature-settings: 'tnum'; }
    ]]></style>

    <!-- 카드 배경 그라데이션 (크림 화이트 → 더스티 핑크) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="55%" stop-color="#FBEFE8"/>
      <stop offset="100%" stop-color="#F5D0CC"/>
    </linearGradient>

    <!-- 미세 노이즈 효과 (텍스처 흉내) -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.6
                             0 0 0 0 0.55
                             0 0 0 0 0.5
                             0 0 0 0.04 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>

    <!-- 컬러 칩용 부드러운 그림자 -->
    <filter id="chipShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.08"/>
    </filter>

    <!-- 행운 숫자 원 글로우 -->
    <radialGradient id="numGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF8F2" stop-opacity="1"/>
      <stop offset="80%" stop-color="#F5D0CC" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F5D0CC" stop-opacity="0"/>
    </radialGradient>

    <!-- 미니 별 일러스트 (재사용) -->
    <symbol id="star" viewBox="-10 -10 20 20">
      <path d="M0,-9 L2.5,-2.5 L9,-2.5 L3.5,1.5 L5.5,8 L0,4 L-5.5,8 L-3.5,1.5 L-9,-2.5 L-2.5,-2.5 Z"
            fill="currentColor" stroke="none"/>
    </symbol>

    <!-- 미니 달 일러스트 (재사용) -->
    <symbol id="moon" viewBox="-12 -12 24 24">
      <path d="M-2,-10 A10,10 0 1 0 8,8 A8,8 0 1 1 -2,-10 Z"
            fill="currentColor" stroke="none"/>
    </symbol>

    <!-- 미니 꽃 일러스트 (재사용) -->
    <symbol id="flower" viewBox="-15 -15 30 30">
      <g fill="currentColor">
        <circle cx="0" cy="-8" r="5"/>
        <circle cx="7" cy="-2.5" r="5"/>
        <circle cx="4.5" cy="6.5" r="5"/>
        <circle cx="-4.5" cy="6.5" r="5"/>
        <circle cx="-7" cy="-2.5" r="5"/>
        <circle cx="0" cy="0" r="3.5" fill="#FBEFE8"/>
      </g>
    </symbol>
  </defs>

  <!-- ============ 배경 ============ -->
  <rect x="0" y="0" width="1080" height="1920" fill="url(#bgGradient)"/>
  <rect x="0" y="0" width="1080" height="1920" fill="#FAF6F0" filter="url(#grain)" opacity="0.6"/>

  <!-- 외곽 라운드 프레임 (1px 라인) -->
  <rect x="60" y="60" width="960" height="1800" rx="48" ry="48"
        fill="none" stroke="#D9B8B2" stroke-width="2" stroke-opacity="0.5"/>

  <!-- 코너 일러스트: 우상단 달 + 별들 -->
  <g color="#C9A89E" opacity="0.85">
    <use href="#moon" x="900" y="180" width="80" height="80"/>
    <use href="#star" x="820" y="140" width="32" height="32"/>
    <use href="#star" x="960" y="280" width="22" height="22"/>
    <use href="#star" x="780" y="220" width="18" height="18"/>
  </g>

  <!-- 코너 일러스트: 좌하단 꽃 + 별 -->
  <g color="#E8B8B2" opacity="0.75">
    <use href="#flower" x="140" y="1700" width="90" height="90"/>
    <use href="#star" x="240" y="1640" width="22" height="22"/>
    <use href="#star" x="110" y="1620" width="16" height="16"/>
  </g>

  <!-- ============ 상단: 로고 + 이름 + 날짜 ============ -->
  <g>
    <text x="540" y="180" text-anchor="middle"
          class="pretendard" font-size="32" font-weight="500"
          fill="#8C6E68" letter-spacing="4">
      오늘의 K-운세
    </text>

    <!-- 구분선 (작은 별) -->
    <g color="#C9A89E">
      <use href="#star" x="480" y="220" width="14" height="14"/>
      <use href="#star" x="540" y="220" width="14" height="14"/>
      <use href="#star" x="600" y="220" width="14" height="14"/>
    </g>

    <text x="540" y="320" text-anchor="middle"
          class="pretendard" font-size="56" font-weight="700"
          fill="#3D2B26">
      민티님의 하루
    </text>

    <text x="540" y="380" text-anchor="middle"
          class="pretendard" font-size="30" font-weight="400"
          fill="#8C6E68" letter-spacing="2">
      2026년 5월 16일 토요일
    </text>
  </g>

  <!-- ============ 중앙: 운세 한 줄 ============ -->
  <g>
    <!-- 따옴표 장식 (여는 따옴표) -->
    <text x="200" y="700"
          class="pretendard" font-size="180" font-weight="800"
          fill="#F5D0CC" opacity="0.7">"</text>

    <!-- 운세 본문 (손글씨 톤) -->
    <text x="540" y="800" text-anchor="middle"
          class="handwriting" font-size="62" font-weight="400"
          fill="#3D2B26">
      <tspan x="540" dy="0">오늘은 작은 시작이</tspan>
      <tspan x="540" dy="90">큰 변화를 만듭니다</tspan>
    </text>

    <!-- 닫는 따옴표 -->
    <text x="880" y="980"
          class="pretendard" font-size="180" font-weight="800"
          fill="#F5D0CC" opacity="0.7">"</text>
  </g>

  <!-- ============ 중간 구분 (작은 점 3개) ============ -->
  <g fill="#C9A89E">
    <circle cx="500" cy="1100" r="5"/>
    <circle cx="540" cy="1100" r="5"/>
    <circle cx="580" cy="1100" r="5"/>
  </g>

  <!-- ============ 하단: 정보 카드 3분할 ============ -->
  <!-- 배경 카드 (반투명 흰색) -->
  <rect x="100" y="1180" width="880" height="540" rx="36" ry="36"
        fill="#FFFFFF" fill-opacity="0.55"
        stroke="#E8D5CF" stroke-width="1.5"/>

  <!-- 좌측: 행운 컬러 3개 -->
  <g>
    <text x="240" y="1260" text-anchor="middle"
          class="pretendard" font-size="26" font-weight="600"
          fill="#8C6E68" letter-spacing="3">
      LUCKY COLOR
    </text>
    <text x="240" y="1296" text-anchor="middle"
          class="pretendard" font-size="22" font-weight="400"
          fill="#A88B85">
      행운의 컬러
    </text>

    <!-- 컬러 칩 1 -->
    <g filter="url(#chipShadow)">
      <circle cx="180" cy="1420" r="48" fill="#F5D0CC"/>
    </g>
    <text x="180" y="1500" text-anchor="middle"
          class="pretendard" font-size="20" font-weight="500"
          fill="#3D2B26">#F5D0CC</text>
    <text x="180" y="1528" text-anchor="middle"
          class="pretendard" font-size="18" font-weight="400"
          fill="#8C6E68">더스티 핑크</text>

    <!-- 컬러 칩 2 -->
    <g filter="url(#chipShadow)">
      <circle cx="300" cy="1420" r="48" fill="#A4C8B0"/>
    </g>
    <text x="300" y="1500" text-anchor="middle"
          class="pretendard" font-size="20" font-weight="500"
          fill="#3D2B26">#A4C8B0</text>
    <text x="300" y="1528" text-anchor="middle"
          class="pretendard" font-size="18" font-weight="400"
          fill="#8C6E68">세이지 그린</text>

    <!-- 컬러 칩 3 -->
    <g filter="url(#chipShadow)">
      <circle cx="240" cy="1620" r="48" fill="#F2C66D"/>
    </g>
    <text x="240" y="1700" text-anchor="middle"
          class="pretendard" font-size="20" font-weight="500"
          fill="#3D2B26">#F2C66D</text>
    <text x="240" y="1728" text-anchor="middle"
          class="pretendard" font-size="18" font-weight="400"
          fill="#8C6E68">머스타드 옐로우</text>
  </g>

  <!-- 중앙 세로 구분선 -->
  <line x1="430" y1="1260" x2="430" y2="1660" stroke="#E8D5CF" stroke-width="1.5"/>

  <!-- 중앙: 행운 숫자 -->
  <g>
    <text x="540" y="1260" text-anchor="middle"
          class="pretendard" font-size="26" font-weight="600"
          fill="#8C6E68" letter-spacing="3">
      LUCKY NUMBER
    </text>
    <text x="540" y="1296" text-anchor="middle"
          class="pretendard" font-size="22" font-weight="400"
          fill="#A88B85">
      행운의 숫자
    </text>

    <!-- 숫자 글로우 원 -->
    <circle cx="540" cy="1490" r="140" fill="url(#numGlow)"/>
    <circle cx="540" cy="1490" r="100" fill="#FFFFFF" fill-opacity="0.6"
            stroke="#F5D0CC" stroke-width="3"/>

    <text x="540" y="1540" text-anchor="middle"
          class="num-display" font-size="180" font-weight="800"
          fill="#3D2B26">7</text>
  </g>

  <!-- 중앙 세로 구분선 2 -->
  <line x1="650" y1="1260" x2="650" y2="1660" stroke="#E8D5CF" stroke-width="1.5"/>

  <!-- 우측: 행운 키워드 -->
  <g>
    <text x="840" y="1260" text-anchor="middle"
          class="pretendard" font-size="26" font-weight="600"
          fill="#8C6E68" letter-spacing="3">
      LUCKY WORD
    </text>
    <text x="840" y="1296" text-anchor="middle"
          class="pretendard" font-size="22" font-weight="400"
          fill="#A88B85">
      행운의 키워드
    </text>

    <!-- 키워드 배경 라운드 -->
    <rect x="720" y="1430" width="240" height="120" rx="60" ry="60"
          fill="#FBEFE8" stroke="#F5D0CC" stroke-width="2"/>

    <text x="840" y="1510" text-anchor="middle"
          class="pretendard" font-size="64" font-weight="700"
          fill="#3D2B26">용기</text>

    <text x="840" y="1620" text-anchor="middle"
          class="pretendard" font-size="22" font-weight="400"
          fill="#8C6E68">
      오늘 마음에 새길 한 단어
    </text>
  </g>

  <!-- ============ 하단 워터마크 ============ -->
  <g>
    <text x="540" y="1830" text-anchor="middle"
          class="pretendard" font-size="22" font-weight="500"
          fill="#A88B85" letter-spacing="3">
      오늘의 K-운세
    </text>
    <text x="540" y="1862" text-anchor="middle"
          class="pretendard" font-size="18" font-weight="400"
          fill="#A88B85" letter-spacing="2">
      kfortune.pages.dev
    </text>
  </g>
</svg>
