<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" role="img" aria-label="오늘의 K-운세 카드 1:1">
  <title>오늘의 K-운세 - 민티</title>

  <defs>
    <style type="text/css"><![CDATA[
      @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.min.css');
      @import url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/Cafe24Ohsquareair.css');
      .pretendard { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
      .handwriting { font-family: 'Cafe24Ohsquareair', 'Pretendard', sans-serif; }
      .num-display { font-family: 'Pretendard', sans-serif; font-weight: 800; font-feature-settings: 'tnum'; }
    ]]></style>

    <linearGradient id="bgGradientSq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="100%" stop-color="#F5D0CC"/>
    </linearGradient>

    <filter id="grainSq" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.6
                             0 0 0 0 0.55
                             0 0 0 0 0.5
                             0 0 0 0.04 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>

    <filter id="chipShadowSq" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.08"/>
    </filter>

    <radialGradient id="numGlowSq" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF8F2" stop-opacity="1"/>
      <stop offset="80%" stop-color="#F5D0CC" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F5D0CC" stop-opacity="0"/>
    </radialGradient>

    <symbol id="starSq" viewBox="-10 -10 20 20">
      <path d="M0,-9 L2.5,-2.5 L9,-2.5 L3.5,1.5 L5.5,8 L0,4 L-5.5,8 L-3.5,1.5 L-9,-2.5 L-2.5,-2.5 Z"
            fill="currentColor"/>
    </symbol>

    <symbol id="moonSq" viewBox="-12 -12 24 24">
      <path d="M-2,-10 A10,10 0 1 0 8,8 A8,8 0 1 1 -2,-10 Z"
            fill="currentColor"/>
    </symbol>

    <symbol id="flowerSq" viewBox="-15 -15 30 30">
      <g fill="currentColor">
        <circle cx="0" cy="-8" r="5"/>
        <circle cx="7" cy="-2.5" r="5"/>
        <circle cx="4.5" cy="6.5" r="5"/>
        <circle cx="-4.5" cy="6.5" r="5"/>
        <circle cx="-7" cy="-2.5" r="5"/>
        <circle cx="0" cy="0" r="3.5" fill="#FBEFE8"/>
      </g>
    </symbol>
  </defs>

  <!-- 배경 -->
  <rect x="0" y="0" width="1080" height="1080" fill="url(#bgGradientSq)"/>
  <rect x="0" y="0" width="1080" height="1080" fill="#FAF6F0" filter="url(#grainSq)" opacity="0.6"/>

  <!-- 외곽 프레임 -->
  <rect x="40" y="40" width="1000" height="1000" rx="36" ry="36"
        fill="none" stroke="#D9B8B2" stroke-width="2" stroke-opacity="0.5"/>

  <!-- 우상단 일러스트 -->
  <g color="#C9A89E" opacity="0.85">
    <use href="#moonSq" x="920" y="100" width="64" height="64"/>
    <use href="#starSq" x="860" y="80" width="24" height="24"/>
    <use href="#starSq" x="970" y="180" width="18" height="18"/>
  </g>

  <!-- 좌하단 일러스트 -->
  <g color="#E8B8B2" opacity="0.75">
    <use href="#flowerSq" x="90" y="940" width="64" height="64"/>
    <use href="#starSq" x="170" y="900" width="16" height="16"/>
  </g>

  <!-- ============ 상단: 로고 + 이름 + 날짜 ============ -->
  <text x="540" y="120" text-anchor="middle"
        class="pretendard" font-size="24" font-weight="500"
        fill="#8C6E68" letter-spacing="4">
    오늘의 K-운세
  </text>

  <g color="#C9A89E">
    <use href="#starSq" x="500" y="148" width="12" height="12"/>
    <use href="#starSq" x="540" y="148" width="12" height="12"/>
    <use href="#starSq" x="580" y="148" width="12" height="12"/>
  </g>

  <text x="540" y="220" text-anchor="middle"
        class="pretendard" font-size="40" font-weight="700"
        fill="#3D2B26">
    민티님의 하루
  </text>

  <text x="540" y="260" text-anchor="middle"
        class="pretendard" font-size="22" font-weight="400"
        fill="#8C6E68" letter-spacing="2">
    2026년 5월 16일 토요일
  </text>

  <!-- ============ 중앙: 운세 한 줄 ============ -->
  <text x="160" y="430"
        class="pretendard" font-size="120" font-weight="800"
        fill="#F5D0CC" opacity="0.7">"</text>

  <text x="540" y="490" text-anchor="middle"
        class="handwriting" font-size="44" font-weight="400"
        fill="#3D2B26">
    <tspan x="540" dy="0">오늘은 작은 시작이</tspan>
    <tspan x="540" dy="64">큰 변화를 만듭니다</tspan>
  </text>

  <text x="900" y="620"
        class="pretendard" font-size="120" font-weight="800"
        fill="#F5D0CC" opacity="0.7">"</text>

  <!-- 구분 점 -->
  <g fill="#C9A89E">
    <circle cx="510" cy="700" r="4"/>
    <circle cx="540" cy="700" r="4"/>
    <circle cx="570" cy="700" r="4"/>
  </g>

  <!-- ============ 하단: 3분할 정보 ============ -->
  <rect x="70" y="750" width="940" height="260" rx="28" ry="28"
        fill="#FFFFFF" fill-opacity="0.55"
        stroke="#E8D5CF" stroke-width="1.5"/>

  <!-- 좌측: 행운 컬러 3개 가로 배치 -->
  <g>
    <text x="220" y="800" text-anchor="middle"
          class="pretendard" font-size="18" font-weight="600"
          fill="#8C6E68" letter-spacing="2">
      LUCKY COLOR
    </text>

    <g filter="url(#chipShadowSq)">
      <circle cx="140" cy="880" r="34" fill="#F5D0CC"/>
      <circle cx="220" cy="880" r="34" fill="#A4C8B0"/>
      <circle cx="300" cy="880" r="34" fill="#F2C66D"/>
    </g>

    <text x="140" y="950" text-anchor="middle"
          class="pretendard" font-size="14" font-weight="500"
          fill="#3D2B26">#F5D0CC</text>
    <text x="220" y="950" text-anchor="middle"
          class="pretendard" font-size="14" font-weight="500"
          fill="#3D2B26">#A4C8B0</text>
    <text x="300" y="950" text-anchor="middle"
          class="pretendard" font-size="14" font-weight="500"
          fill="#3D2B26">#F2C66D</text>

    <text x="220" y="980" text-anchor="middle"
          class="pretendard" font-size="14" font-weight="400"
          fill="#8C6E68">핑크 · 그린 · 옐로우</text>
  </g>

  <line x1="400" y1="790" x2="400" y2="970" stroke="#E8D5CF" stroke-width="1.5"/>

  <!-- 중앙: 행운 숫자 -->
  <g>
    <text x="540" y="800" text-anchor="middle"
          class="pretendard" font-size="18" font-weight="600"
          fill="#8C6E68" letter-spacing="2">
      LUCKY NUMBER
    </text>

    <circle cx="540" cy="900" r="80" fill="url(#numGlowSq)"/>
    <circle cx="540" cy="900" r="60" fill="#FFFFFF" fill-opacity="0.6"
            stroke="#F5D0CC" stroke-width="2.5"/>

    <text x="540" y="932" text-anchor="middle"
          class="num-display" font-size="100" font-weight="800"
          fill="#3D2B26">7</text>
  </g>

  <line x1="680" y1="790" x2="680" y2="970" stroke="#E8D5CF" stroke-width="1.5"/>

  <!-- 우측: 행운 키워드 -->
  <g>
    <text x="840" y="800" text-anchor="middle"
          class="pretendard" font-size="18" font-weight="600"
          fill="#8C6E68" letter-spacing="2">
      LUCKY WORD
    </text>

    <rect x="740" y="850" width="200" height="90" rx="45" ry="45"
          fill="#FBEFE8" stroke="#F5D0CC" stroke-width="2"/>

    <text x="840" y="912" text-anchor="middle"
          class="pretendard" font-size="48" font-weight="700"
          fill="#3D2B26">용기</text>

    <text x="840" y="975" text-anchor="middle"
          class="pretendard" font-size="14" font-weight="400"
          fill="#8C6E68">오늘의 한 단어</text>
  </g>

  <!-- 워터마크 -->
  <text x="540" y="1042" text-anchor="middle"
        class="pretendard" font-size="14" font-weight="400"
        fill="#A88B85" letter-spacing="2">
    오늘의 K-운세 · kfortune.pages.dev
  </text>
</svg>
